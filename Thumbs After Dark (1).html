let AC = null, master = null, muted = false, humGain = null;

  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.55; master.connect(AC.destination);
    const o = AC.createOscillator(), o2 = AC.createOscillator();
    humGain = AC.createGain(); humGain.gain.value = 0.0;
    o.type = 'sawtooth'; o.frequency.value = 50; o2.type = 'sine'; o2.frequency.value = 100.6;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 180;
    o.connect(lp); o2.connect(lp); lp.connect(humGain); humGain.connect(master); o.start(); o2.start();
  } catch (e) { AC = null; }
}
function setMuted(m) { muted = m; if (master) master.gain.value = m ? 0 : 0.55; }
function tone(f, d, type, v, slide, delay) {

  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t0 + d);
  g.gain.setValueAtTime(v || 0.2, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);

function noise(d, v, f1, f2, delay) {
  if (!AC) return;
  const t0 = AC.currentTime + (delay || 0);
  const n = Math.floor(AC.sampleRate * d), buf = AC.createBuffer(1, n, AC.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(); s.buffer = buf;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f1 || 1000; bp.Q.value = 0.8;
  if (f2) bp.frequency.exponentialRampToValueAtTime(f2, t0 + d);
  const g = AC.createGain(); g.gain.setValueAtTime(v || 0.3, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);

function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function shade(h, a) {
  const [r, g, b] = hexRgb(h);

  return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
}
function grad(x0, y0, x1, y1, stops) {

}

}

  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  c.strokeStyle = 'rgba(200,60,60,.35)'; c.lineWidth = Math.max(1, r * 0.04);
  for (let i = 0; i < 4; i++) {

    c.lineTo(x + Math.cos(a + 0.2) * r * 0.62, y + Math.sin(a + 0.2) * r * 0.62); c.stroke();

// Chuggy: fourth photo cut-out. run=true: legs pump up and down (each leg is its own slice, lifted in turn).
function drawChuggy(x, by, h, t, run) {
  const im = IMG.chuggy;
  if (!im || !im.complete || !im.naturalWidth) return;
  const iw = im.naturalWidth, ih = im.naturalHeight, sc = h / ih, w = iw * sc;

function updateThumbs(dt) {
  const th = G.th, ai = aiOf('thumbs');
  if (th.room === 'DOOR') {
    th.stepT -= dt; if (th.stepT <= 0) { th.stepT = 1.3; sfx.step(); }

      th.leave += dt;

    } else {
      th.leave = 0; th.doorT += dt;
      if (th.doorT > th.wait) kill('thumbs');
    }
    return;
  }
  th.cd -= dt;
  if (th.cd <= 0) {
    th.cd = rand(4.5, 7.5);
    if (rand(0, 20) < ai) {
      const next = pick(NB[th.room]);
      th.room = next;
      if (next === 'DOOR') { th.doorT = 0; th.leave = 0; th.wait = Math.max(2.4, 5.2 - G.n * 0.4) + 0.9 * lvl('doorstop'); sfx.thump(); if (G.doorE > 0.9) sfx.knock(); }

  }
}
function updateMitts(dt) {
  const mi = G.mi, ai = aiOf('mitts'); if (!ai) return;
  if (mi.s === 2) {
    if (G.ventSeal > 0) {
      mi.leave += dt;

  }
  if (mi.stun > 0) { mi.stun -= dt; return; }
  mi.cd -= dt;

}

function update(dt) {
  if (screen === 'jump') {
    G.deadT += dt;
    if (G.deadT > 1.9) { screen = 'over'; }
    return;
  }
  if (screen === 'win') {
    G.winT += dt;
    if (G.winT > 3.6) {
      const wage = Math.round((60 + 25 * G.n) * (1 + 0.15 * lvl('wage'))), bonus = Math.floor(Math.max(0, G.power) / 4), first = G.n === 5 ? 100 : 0;
      lastPay = { wage, bonus, first, total: wage + bonus + first, n: G.n, power: Math.max(0, G.power) };
      save.money += lastPay.total;
      if (G.n < 5) save.night = Math.max(save.night, G.n + 1); else save.beaten = true;
      writeSave(); sfx.cash(); screen = 'pay';
    }
    return;
  }
  if (screen !== 'night' || paused) return;
  dt *= dev.speed;
  G.t += dt;
  G.flash = Math.max(0, G.flash - dt);
  G.hintT = Math.max(0, G.hintT - dt); G.msgT = Math.max(0, G.msgT - dt); G.shake = Math.max(0, G.shake - dt);
  G.mon = clamp(G.mon + (G.monTgt ? 1 : -1) * dt * 5, 0, 1);
  G.pan += (G.panT - G.pan) * Math.min(1, dt * 5);
  G.doorW = clamp(G.doorW + (G.tgtW ? 1 : -1) * dt * 4.5, 0, 1);
  G.doorE = clamp(G.doorE + (G.tgtE ? 1 : -1) * dt * 4.5, 0, 1);
  if (G.ventSeal > 0) { G.ventSeal -= dt; if (G.ventSeal <= 0) G.ventCd = 3.5; }
  if (G.ventCd > 0) G.ventCd -= dt;
  if (G.t >= 6 * HOUR_LEN) { screen = 'win'; G.winT = 0; sfx.chime(); return; }
  if (!G.out) {
    G.power -= dt * 0.085 * usage() * [1, 0.88, 0.76, 0.64][lvl('battery')];
    if (G.power <= 0) {
      G.power = 0; G.out = true; G.outT = rand(7, 11) + 10 * lvl('reserve');
      G.tgtW = 0; G.tgtE = 0; G.lightW = false; G.lightE = false; G.monTgt = false; G.tunePlayed = false;
      sfx.door(); say('POWER OUT', 4);
    }
    if (dev.inf) G.power = 100;
    if (!dev.freeze) { updateThumbs(dt); updateMitts(dt); updateDash(dt); updateGazer(dt); }
  } else {
    G.outT -= dt;
    if (G.outT < 4.2 && !G.tunePlayed) { G.tunePlayed = true; sfx.tune(); }
    if (G.outT <= 0) kill('thumbs');
  }
  if (humGain) humGain.gain.value = G.out ? 0 : 0.05 + (G.monTgt ? 0.02 : 0);
}

function pointerPos(e) {

  if (screen === 'night' && G.mon < 0.5 && !paused && !touchMode) G.panT = clamp((mouse.x / W - 0.12) / 0.76, 0, 1);
  if (panDrag && screen === 'night') G.panT = clamp(panDrag.p - (mouse.x - panDrag.x) / 520, 0, 1);
}
function topHit() { for (let i = hits.length - 1; i >= 0; i--) { const h = hits[i]; if (mouse.x >= h.x && mouse.x <= h.x + h.w && mouse.y >= h.y && mouse.y <= h.y + h.h) return h; } return null; }
let holdHit = null;
cv.addEventListener('pointerdown', e => {
  audioInit(); pointerPos(e);
  if (paused) { const ph = topHit(); if (ph && ph.pause && ph.fn) ph.fn(); else pauseConfirm = null; return; }
  const h = topHit();

  else if (touchMode && screen === 'night' && G.mon < 0.5) panDrag = { x: mouse.x, p: G.panT };
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
});

const release = () => { if (holdHit && holdHit.up) holdHit.up(); holdHit = null; panDrag = null; };

const keysDown = {};

function drawJump(t) {
  const d = G.deadT;
  c.save();
  rect(0, 0, W, H, grad(0, 0, 0, H, [[0, '#d4d7db'], [1, '#a8acb2']]));
  const k = Math.min(1, d / 0.16), ease = 1 - Math.pow(1 - k, 3);
  const z = 0.5 + 0.7 * ease + (d > 0.16 ? Math.sin((d - 0.16) * 38) * 0.012 : 0);
  const amp = 8 + 34 * Math.max(0, 1 - d / 1.1), sx = (Math.random() - 0.5) * amp, sy = (Math.random() - 0.5) * amp * 0.7, reach = 1 + 0.35 * ease;
  c.translate(W / 2 + sx, H + 40 + sy); c.scale(z, z); c.translate(-W / 2, -H - 40);
  const who = G.dead;

  }
  // red pulse vignette

function canStand(x, y) {

// pixel-art photo sprites: downscale + posterise to a few colours
function pxSprite(key, h, levels) {
  const k = key + h; if (PXC[k]) return PXC[k];
  const im = IMG[key]; if (!im || !im.complete || !im.naturalWidth) return null;
  const w = Math.max(4, Math.round(im.naturalWidth * h / im.naturalHeight)), cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const x = cv.getContext('2d'); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high'; x.drawImage(im, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h), L = (levels || 5) - 1;
  for (let i = 0; i < d.data.length; i += 4) {
    if (d.data[i + 3] < 120) { d.data[i + 3] = 0; continue; } d.data[i + 3] = 255;
    for (let j = 0; j < 3; j++) d.data[i + j] = Math.round(d.data[i + j] / 255 * L) * 255 / L;
  }
  x.putImageData(d, 0, 0); return (PXC[k] = cv);
}

  if (C.flash > 0) { lc.fillStyle = 'rgba(255,255,255,' + C.flash * 1.4 + ')'; lc.fillRect(0, 0, LW, LH); }
  const dang = Math.max(0, 1 - C.gap / 50); if (dang > 0 && !C.done) { lc.fillStyle = 'rgba(200,20,30,' + dang * 0.28 + ')'; lc.fillRect(0, 0, LW, LH); }
  // HUD
  R(8, 6, 104, 8, '#000'); R(9, 7, 102, 6, '#2a2540'); R(9, 7, Math.max(0, C.gap) * 102 / 96, 6, C.gap < 30 ? P8.red : P8.green);
  lc.fillStyle = '#fff'; lc.font = '10px VT323, monospace'; lc.textAlign = 'left'; lc.fillText('DISTANCE', 8, 24); R(8, 28, 104, 4, '#000'); R(9, 29, Math.min(102, C.x / CH_LEN * 102), 2, P8.gold);
  if (C.t < 3.4 && !C.caught) { lc.textAlign = 'center'; lc.font = '16px VT323, monospace'; lc.fillStyle = Math.floor(t * 4) % 2 ? '#ffd84a' : '#fff'; lc.fillText(C.t < 1.2 ? 'RUN!' : 'SPACE / UP = JUMP     DOWN = DUCK', LW / 2, 70); }
  if (C.caught) { lc.fillStyle = 'rgba(0,0,0,.6)'; lc.fillRect(0, 0, LW, LH); lc.textAlign = 'center'; lc.fillStyle = P8.red; lc.font = '28px VT323, monospace'; lc.fillText('CAUGHT!', LW / 2, 80); lc.fillStyle = '#fff'; lc.font = '14px VT323, monospace'; lc.fillText('They got you. Try again?', LW / 2, 100); }
  if (C.done) {
    const wh = Math.min(1, Math.max(0, (C.endT - 0.8) / 1.2)); lc.fillStyle = 'rgba(255,255,245,' + wh + ')'; lc.fillRect(0, 0, LW, LH);
    if (C.endT > 2) { lc.textAlign = 'center'; lc.fillStyle = '#1a1850'; lc.font = '26px VT323, monospace'; lc.fillText('YOU ESCAPED!', LW / 2, 78); lc.font = '14px VT323, monospace'; lc.fillText('Dawn breaks outside.', LW / 2, 98); lc.fillText('They are still smiling inside...', LW / 2, 112); if (C.endT > 2.4 && Math.floor(t * 2) % 2) lc.fillText('- click to continue -', LW / 2, 140); }
  }
  // present
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H); c.imageSmoothingEnabled = false; c.drawImage(lowCv, 0, 0, W, H); c.imageSmoothingEnabled = true;
  c.fillStyle = 'rgba(0,0,0,.14)'; for (let y = 0; y < H; y += 4) c.fillRect(0, y, W, 1);
  hit(0, 0, W, H, null, () => {
    if (C.caught) { startChase(); return; } if (C.done) { if (C.endT > 2.4) chaseSkip(); return; }
    if (mouse.y > H * 0.62) C.held = 2; else chaseJump();
  }, () => { C.held = 0; });
  if (C.caught) btn('RETRY', W / 2 - 150, 470, 140, 50, startChase, { primary: true, size: 24 });
  if (touchMode && !C.caught && !C.done) drawChaseButtons(C);
  btn('SKIP', W - 170, 650, 140, 46, chaseSkip, { size: 20 });
}

// ===== MOBILE / TOUCH SUPPORT =====
let touchMode = false, panDrag = null;
function initMobile() {
  let coarse = false; try { coarse = navigator.maxTouchPoints > 0 && matchMedia('(pointer:coarse)').matches; } catch (e) {}
  touchMode = save.mobile !== undefined ? !!save.mobile : coarse;
  window.addEventListener('pointerdown', e => { if (e.pointerType === 'touch' && save.mobile === undefined && !touchMode) touchMode = true; }, true);
}
function toggleFS() {
  try {
    const d = document, el = d.documentElement;
    if (d.fullscreenElement) { d.exitFullscreen(); return; }
    const p = el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen && el.webkitRequestFullscreen();
    if (p && p.then) p.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {});
  } catch (e) {}
}
function mpill(label, x, y, w, h, fn, on, size) {
  c.save(); c.fillStyle = on ? '#3d6fb8' : 'rgba(22,25,29,.86)'; c.strokeStyle = on ? '#9fc4ff' : '#9aa1a8'; c.lineWidth = 2; c.beginPath(); c.roundRect(x, y, w, h, h / 2); c.fill(); c.stroke();
  c.fillStyle = '#f2f4f5'; c.font = (size || 20) + 'px ' + FM; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(label, x + w / 2, y + h / 2 + 1); c.restore();
  hit(x, y, w, h, () => { sfx.click(); fn(); });
}
function drawMobileTitle() {
  mpill(touchMode ? 'MOBILE: ON' : 'MOBILE: OFF', W - 330, 14, 160, 40, () => { touchMode = !touchMode; save.mobile = touchMode; writeSave(); }, touchMode, 19);
  mpill('FULLSCREEN', W - 160, 14, 146, 40, toggleFS, false, 19);
}
function drawMobileHUD(t) {
  if (!touchMode) return;
  c.save(); c.textBaseline = 'alphabetic';
  mpill('II', W - 90, 104, 70, 50, () => { paused = true; }, false, 26);
  if (monitorUp()) {
    const cyc = d => { const i = CAMS.findIndex(x => x.id === G.cam); setCam(CAMS[(i + d + 10) % 10].id); };
    mpill('◀ CAM', W / 2 - 330, H - 56, 120, 46, () => cyc(-1), false, 22);
    mpill('CAM ▶', W / 2 + 210, H - 56, 120, 46, () => cyc(1), false, 22);
  } else {
    if (G.pan > 0.08) hit(0, 160, 110, 340, () => { G.panT = clamp(G.panT - 0.3, 0, 1); });
    if (G.pan < 0.92) hit(W - 110, 160, 110, 340, () => { G.panT = clamp(G.panT + 0.3, 0, 1); });
    c.fillStyle = 'rgba(255,255,255,.55)'; c.font = '20px ' + FM; c.textAlign = 'center'; if (G.hintT > 0 || G.n === 1) c.fillText('Drag to look around  -  hold the light buttons to see down the halls', W / 2, H - 70);
  }
  c.restore();
}
function drawDpad(dlg) {
  if (!touchMode || dlg) return;
  const cx = 150, cy = 560, s = 74, keys = [['arrowup', '▲', 0, -1], ['arrowdown', '▼', 0, 1], ['arrowleft', '◀', -1, 0], ['arrowright', '▶', 1, 0]];
  keys.forEach(k => {
    const x = cx - s / 2 + k[2] * (s + 6), y = cy - s / 2 + k[3] * (s + 6); const on = keysDown[k[0]];
    c.save(); c.fillStyle = on ? 'rgba(61,111,184,.85)' : 'rgba(22,25,29,.6)'; c.strokeStyle = '#cfd4da'; c.lineWidth = 3; c.beginPath(); c.roundRect(x, y, s, s, 14); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.font = '34px ' + FM; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(k[1], x + s / 2, y + s / 2 + 2); c.restore();
    hit(x - 6, y - 6, s + 12, s + 12, null, () => { keysDown[k[0]] = true; }, () => { keysDown[k[0]] = false; });
  });
}
function drawChaseButtons(C) {
  const b = (label, x, on, down, up) => {
    c.save(); c.fillStyle = on ? 'rgba(61,111,184,.88)' : 'rgba(22,25,29,.62)'; c.strokeStyle = '#e6e8ea'; c.lineWidth = 4; c.beginPath(); c.roundRect(x, 486, 230, 140, 22); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.font = '44px ' + FD; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(label, x + 115, 556); c.restore();
    hit(x, 486, 230, 140, null, down, up);
  };
  b('DUCK', 24, C.held === 2, () => { C.held = 2; }, () => { C.held = 0; });
  b('JUMP', W - 254, C.y > 0, () => chaseJump(), () => {});
}
